services:
  timescaledb:
    image: timescale/timescaledb-ha:pg17
    container_name: trading_tsdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading_local
      POSTGRES_DB: trading
    ports: ["5432:5432"]
    volumes: ["tsdb_data:/home/postgres/pgdata/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: trading_redis
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Separate INSTANCE, not a separate database number, because Redis pub/sub
  # is not scoped by db: a subscriber on db1 receives what a publisher sends
  # on db7 (verified against this very image). Sharing an instance therefore
  # means the test suite's fixture messages land on live ingestors' channels
  # -- which is exactly how a pytest run killed the bar_aggregator mid-session
  # with a ForeignKeyViolation on a fixture instrument_id. Deliberately has no
  # volume: nothing here should ever survive a restart.
  redis_test:
    image: redis:7-alpine
    container_name: trading_redis_test
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  tsdb_data:
