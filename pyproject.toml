[project]
name = "trading"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "polars>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "structlog>=24.1",
    "websockets>=12.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "protobuf>=5.0",
    "mcp>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "grpcio-tools>=1.60",
    "types-protobuf>=5.0",
    "hypothesis>=6.167.1",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not golden'"
markers = [
    "live: hits the real network; excluded from the default run",
    "db: requires a running TimescaleDB",
    "golden: grades the cost model against real broker figures; needs a contract note",
    "sandbox: runs real containers to prove strategy isolation; needs Docker and the trading-strategy-sandbox image",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "docs",
    ".superpowers",
    ".remember",
    "implementation-plan.md",
    "src/trading/streaming/upstox_proto/MarketDataFeed_pb2.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
